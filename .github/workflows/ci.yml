name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pos_saas_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, mysql, redis, zip, gd, bcmath
          coverage: xdebug

      - name: Copy backend env
        working-directory: backend
        run: cp .env.example .env

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        working-directory: backend
        run: php artisan key:generate

      - name: Run Migrations
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: pos_saas_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Run Seeders
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: pos_saas_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan db:seed --force

      - name: Run Tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: pos_saas_testing
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
        run: php artisan test --parallel --coverage --min=80

      - name: PHPStan
        working-directory: backend
        run: |
          composer require --dev larastan/larastan --no-interaction
          vendor/bin/phpstan analyse app --level=5 --no-progress || true

      - name: Composer Audit
        working-directory: backend
        run: composer audit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, mysql, zip

      - name: Composer Audit
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-scripts
          composer audit

      - name: Check for hardcoded secrets
        run: |
          ! grep -r "password.*=.*['\"]\w\{8,\}['\"]" backend/.env backend/config/ --include="*.php" 2>/dev/null || echo "Warning: Potential hardcoded secrets found"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, security-audit]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Deploy notification
        run: |
          echo "Deploying to staging environment"
          echo "Build artifacts ready for deployment"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, security-audit]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy notification
        run: |
          echo "Deploying to production environment"
          echo "All checks passed. Ready for production deployment."
